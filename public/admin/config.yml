# Decap CMSの設定ファイル。ここに書いたフィールドが、そのまま管理画面のフォームになる。
# 各コレクションは src/content.config.ts のスキーマ（Zod）と対応させている。
#
# 認証（OAuth仲介サーバー）: Cloudflare Workers上に sterlingwes/decap-proxy をデプロイ済み
# （ワーカー名 unacone-cms-auth、リポジトリはこのプロジェクトとは別に
# C:\Users\ytkyf\OneDrive\Desktop\unacone-cms-auth に配置。詳細はCLAUDE-3.md参照）。

backend:
  name: github
  repo: furugami/unacone
  branch: main
  base_url: https://unacone-cms-auth.furugami.workers.dev
  auth_endpoint: /auth

media_folder: "public/images/uploads"
# サイトのbaseパス（/unacone）を含めた実際のURLにする。
# 理由: これを省略すると値は移植しやすくなるが、Decap CMS自体の編集画面プレビューが
# サブパスを認識できず壊れて見える（2026/08/29に実際に発生・確認済み）。
# 毎回の編集体験を優先し、あえて実URLを直書きする。将来リポジトリ名を変える場合は
# 既存コンテンツのicon/thumbnailフィールドを一括置換する必要がある。
public_folder: "/unacone/images/uploads"
# 上記はコレクション側で media_folder/public_folder を指定していない場合のフォールバック
# （既存の画像はここに残っているので動き続ける）。2026/08/29以降、各コレクションは
# 下のサブフォルダ（uploads/pokemon, uploads/held-items 等）にアップロードされるよう
# コレクションごとに上書き設定している。メディアライブラリが種類別に分かれて選びやすくなる。

collections:
  - name: "pokemon-jp"
    label: "ポケモン図鑑"
    folder: "src/content/pokemon-jp"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name_ja"
    media_folder: "/public/images/uploads/pokemon"
    public_folder: "/unacone/images/uploads/pokemon"
    fields:
      - { label: "スラッグ（半角英数、ファイル名になる）", name: "slug", widget: "string" }
      - { label: "日本語名", name: "name_ja", widget: "string" }
      - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
      - label: "ロール"
        name: "role"
        widget: "select"
        options:
          - { label: "アタック型", value: "attacker" }
          - { label: "スピード型", value: "speedster" }
          - { label: "ディフェンス型", value: "defender" }
          - { label: "サポート型", value: "supporter" }
          - { label: "バランス型", value: "allrounder" }
      - label: "攻撃分類（任意）"
        name: "attack_type"
        widget: "select"
        required: false
        options:
          - { label: "攻撃", value: "physical" }
          - { label: "特攻", value: "special" }
      - label: "能力評価（5点満点・0.5刻み、任意。5項目まとめて設定する）"
        name: "abilities"
        widget: "object"
        required: false
        fields:
          - { label: "戦闘能力", name: "combat", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
          - { label: "耐久能力", name: "durability", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
          - { label: "起動能力", name: "mobility", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
          - { label: "得点能力", name: "scoring", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
          - { label: "補佐能力", name: "support", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
      - label: "使用難易度（任意）"
        name: "difficulty"
        widget: "select"
        required: false
        options:
          - { label: "初心者向け", value: "beginner" }
          - { label: "中級者向け", value: "intermediate" }
          - { label: "上級者向け", value: "advanced" }
      - label: "わざ説明（任意。更新頻度は低い想定）"
        name: "moves"
        widget: "object"
        required: false
        fields:
          - label: "とくせい"
            name: "ability"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ1"
            name: "move1"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ1派生A"
            name: "move1_upgrade_a"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ1派生B"
            name: "move1_upgrade_b"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ2"
            name: "move2"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ2派生A"
            name: "move2_upgrade_a"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "わざ2派生B"
            name: "move2_upgrade_b"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
          - label: "ユナイト技"
            name: "unite_move"
            widget: "object"
            required: false
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "効果", name: "effect", widget: "text" }
              - { label: "アイコン画像（任意）", name: "icon", widget: "image", required: false }
      - label: "おすすめビルド"
        name: "builds"
        widget: "list"
        required: false
        fields:
          - { label: "ビルド名", name: "title", widget: "string" }
          - label: "もちもの（3つまで、もちもの図鑑から選択）"
            name: "held_items"
            widget: "list"
            field:
              label: "もちもの"
              name: "held_item"
              widget: "relation"
              collection: "held-items"
              search_fields: ["name_ja"]
              value_field: "slug"
              display_fields: ["name_ja"]
          - label: "バトルアイテム（バトルアイテム図鑑から選択）"
            name: "battle_item"
            widget: "relation"
            collection: "battle-items"
            search_fields: ["name_ja"]
            value_field: "slug"
            display_fields: ["name_ja"]
          - label: "わざ1の選択（任意。上のわざ説明で入力した内容から選ぶ）"
            name: "move1_choice"
            widget: "select"
            required: false
            options:
              - { label: "わざ1（派生なし）", value: "base" }
              - { label: "わざ1派生A", value: "upgrade_a" }
              - { label: "わざ1派生B", value: "upgrade_b" }
          - label: "わざ2の選択（任意）"
            name: "move2_choice"
            widget: "select"
            required: false
            options:
              - { label: "わざ2（派生なし）", value: "base" }
              - { label: "わざ2派生A", value: "upgrade_a" }
              - { label: "わざ2派生B", value: "upgrade_b" }
          - { label: "補足", name: "note", widget: "string", required: false }
      - { label: "立ち回り解説（本文）", name: "body", widget: "markdown" }

  - name: "tier-list"
    label: "ポケモンTier表"
    files:
      - name: "tier-list"
        label: "ポケモンTier表編集"
        file: "src/content/config/tier-list.md"
        fields:
          - label: "Sランク（トップページのTier表に載せたいポケモンだけ選択。全ポケモン分の登録は不要）"
            name: "s_tier"
            widget: "list"
            required: false
            field:
              label: "ポケモン"
              name: "pokemon"
              widget: "relation"
              collection: "pokemon-jp"
              search_fields: ["name_ja"]
              value_field: "slug"
              display_fields: ["name_ja"]
              options_length: 999
          - label: "Aランク"
            name: "a_tier"
            widget: "list"
            required: false
            field:
              label: "ポケモン"
              name: "pokemon"
              widget: "relation"
              collection: "pokemon-jp"
              search_fields: ["name_ja"]
              value_field: "slug"
              display_fields: ["name_ja"]
              options_length: 999
          - label: "Bランク"
            name: "b_tier"
            widget: "list"
            required: false
            field:
              label: "ポケモン"
              name: "pokemon"
              widget: "relation"
              collection: "pokemon-jp"
              search_fields: ["name_ja"]
              value_field: "slug"
              display_fields: ["name_ja"]
              options_length: 999
          - label: "Cランク"
            name: "c_tier"
            widget: "list"
            required: false
            field:
              label: "ポケモン"
              name: "pokemon"
              widget: "relation"
              collection: "pokemon-jp"
              search_fields: ["name_ja"]
              value_field: "slug"
              display_fields: ["name_ja"]
              options_length: 999

  - name: "articles"
    label: "セオリー解説記事"
    folder: "src/content/articles"
    create: true
    slug: "{{fields.slug}}"
    media_folder: "/public/images/uploads/articles"
    public_folder: "/unacone/images/uploads/articles"
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "タイトル", name: "title", widget: "string" }
      - label: "難易度カテゴリ"
        name: "category"
        widget: "select"
        options:
          - { label: "初心者向け", value: "beginner" }
          - { label: "中級者向け", value: "intermediate" }
          - { label: "上級者向け", value: "advanced" }
      - { label: "公開日", name: "publish_date", widget: "datetime" }
      - { label: "要約（一覧カードに表示）", name: "excerpt", widget: "text" }
      - { label: "サムネイル（任意）", name: "thumbnail", widget: "image", required: false }
      - { label: "本文（YouTube埋め込み可）", name: "body", widget: "markdown" }

  - name: "streamers"
    label: "配信者プロフィール"
    folder: "src/content/streamers"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name"
    media_folder: "/public/images/uploads/streamers"
    public_folder: "/unacone/images/uploads/streamers"
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "名前", name: "name", widget: "string" }
      - { label: "アイコン（任意）", name: "icon", widget: "image", required: false }
      - { label: "Twitchログイン名（任意）", name: "twitch_channel", widget: "string", required: false }
      - { label: "YouTubeチャンネルID（任意）", name: "youtube_channel_id", widget: "string", required: false }

  - name: "held-items"
    label: "もちもの"
    folder: "src/content/held-items"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name_ja"
    media_folder: "/public/images/uploads/held-items"
    public_folder: "/unacone/images/uploads/held-items"
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "名前", name: "name_ja", widget: "string" }
      - { label: "アイコン（任意）", name: "icon", widget: "image", required: false }
      - { label: "要約（一覧に表示）", name: "summary", widget: "text" }
      - label: "ステータス上昇（任意、複数追加可）"
        name: "stat_boosts"
        widget: "list"
        required: false
        fields:
          - label: "ステータス"
            name: "stat"
            widget: "select"
            options:
              - { label: "攻撃", value: "attack" }
              - { label: "通常攻撃の速さ", value: "attack_speed" }
              - { label: "急所率", value: "critical_hit_rate" }
              - { label: "HP", value: "hp" }
              - { label: "特攻", value: "sp_attack" }
              - { label: "急所ダメージ増加", value: "critical_hit_damage" }
              - { label: "わざの待ち時間", value: "cooldown_reduction" }
              - { label: "特防", value: "sp_defense" }
              - { label: "ユナイトわざゲージの溜まりやすさ", value: "unite_gauge_charge" }
              - { label: "移動速度", value: "movement_speed" }
              - { label: "防御", value: "defense" }
              - { label: "HP回復", value: "hp_recovery" }
          - { label: "数値", name: "value", widget: "number" }
      - { label: "効果の説明（本文）", name: "body", widget: "markdown" }

  - name: "battle-items"
    label: "バトルアイテム"
    folder: "src/content/battle-items"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name_ja"
    media_folder: "/public/images/uploads/battle-items"
    public_folder: "/unacone/images/uploads/battle-items"
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "名前", name: "name_ja", widget: "string" }
      - { label: "アイコン（任意）", name: "icon", widget: "image", required: false }
      - { label: "クールダウン（秒、任意）", name: "cooldown_seconds", widget: "number", value_type: "int", required: false }
      - { label: "解放条件（トレーナーレベルの数値、または「ショップで購入可能」等の自由記述。任意）", name: "unlock_level", widget: "string", required: false }
      - { label: "効果の説明（本文）", name: "body", widget: "markdown" }
      - label: "おすすめポケモン（ポケモン図鑑から選択、複数可・任意）"
        name: "recommended_pokemon"
        widget: "list"
        required: false
        field:
          label: "ポケモン"
          name: "pokemon"
          widget: "relation"
          collection: "pokemon-jp"
          search_fields: ["name_ja"]
          value_field: "slug"
          display_fields: ["name_ja"]
          options_length: 999
      - label: "よくある質問（任意）"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "質問", name: "question", widget: "string" }
          - { label: "回答", name: "answer", widget: "text" }

  - name: "medals"
    label: "メダル"
    folder: "src/content/medals"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name_ja"
    media_folder: "/public/images/uploads/medals"
    public_folder: "/unacone/images/uploads/medals"
    # 「表示順」列でソートできるようにする（2026/08/31追加）。Decap CMSには
    # 初期表示順を固定する機能が無いため、開いた時点では自動でorder順にはならず、
    # 一覧画面でこの列を毎回クリックして並び替える必要がある点に注意。
    sortable_fields: ["order", "name_ja"]
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "名前", name: "name_ja", widget: "string" }
      - { label: "対象ポケモンのスラッグ（任意）", name: "pokemon_slug", widget: "string", required: false }
      - { label: "アイコン（任意）", name: "icon", widget: "image", required: false }
      - { label: "要約（一覧に表示、任意）", name: "summary", widget: "text", required: false }
      - { label: "表示順（一覧での並び順、数値が小さいほど先に表示。任意）", name: "order", widget: "number", value_type: "int", required: false }
      - label: "属性色（複数選択可、任意）"
        name: "colors"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "ホワイト", value: "white" }
          - { label: "ブルー", value: "blue" }
          - { label: "パープル", value: "purple" }
          - { label: "ブラウン", value: "brown" }
          - { label: "レッド", value: "red" }
          - { label: "ピンク", value: "pink" }
          - { label: "イエロー", value: "yellow" }
          - { label: "グリーン", value: "green" }
          - { label: "ブラック", value: "black" }
          - { label: "ネイビー", value: "navy" }
          - { label: "グレー", value: "gray" }
      - { label: "入手条件・効果の説明（本文）", name: "body", widget: "markdown" }

  - name: "medal-sets"
    label: "おすすめメダルセット"
    folder: "src/content/medal-sets"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "title"
    fields:
      - { label: "スラッグ", name: "slug", widget: "string" }
      - { label: "セット名", name: "title", widget: "string" }
      - label: "メダル（メダル図鑑から選択、ちょうど10個を目安に）"
        name: "medals"
        widget: "list"
        max: 10
        field:
          label: "メダル"
          name: "medal"
          widget: "relation"
          collection: "medals"
          search_fields: ["name_ja"]
          value_field: "slug"
          display_fields: ["name_ja"]
          options_length: 999

  - name: "settings"
    label: "各種設定"
    files:
      - name: "schedule"
        label: "配信スケジュール設定"
        file: "src/content/config/schedule-settings.md"
        fields:
          - label: "除外するチャンネル名（YouTube検索結果からこのチャンネルを除外する）"
            name: "excluded_channel_names"
            widget: "list"
            required: false
            hint: "配信スケジュールページに表示されているチャンネル名をそのままコピーして追加してください（完全一致で判定します）。"
            field:
              label: "チャンネル名"
              name: "channel_name"
              widget: "string"
