name: Deploy to GitHub Pages

# main へのpush、手動実行（Actionsタブの "Run workflow" ボタン）、
# および30分おきのcronでビルド＆デプロイする。
# 配信スケジュール用のAPIキー（Twitch/YouTube）は未設定でもビルドは失敗しない
# （src/lib/schedule.ts がフォールバックする。CLAUDE-3.md参照）。
#
# cron間隔（30分）の根拠: YouTube Data API v3のキーワード検索
# （fetchYoutubeUpcomingByKeyword、個別配信者検索は使わない前提）は1回のビルドで
# 最大102ユニット消費（search.list 100 + videos.list 1 + channels.list 1）。
# 無料枠は1日10,000ユニット。30分間隔＝48回/日で4,896ユニット（約49%）に抑え、
# CMS編集によるpush起因ビルドやquotaリセット境界のズレ（太平洋時間基準）の
# 安全マージンを残している。個別配信者検索を有効化する場合は消費ユニットが
# 増えるため、間隔の再計算が必要（詳細はCLAUDE-4.md/CLAUDE-5.md参照）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
