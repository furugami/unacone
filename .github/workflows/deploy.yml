name: Deploy to GitHub Pages

# main へのpush、手動実行（Actionsタブの "Run workflow" ボタン）、
# および30分おきのcronでビルド＆デプロイする。
# 配信スケジュール用のAPIキー（Twitch/YouTube）は未設定でもビルドは失敗しない
# （src/lib/schedule.ts がフォールバックする。CLAUDE-3.md参照）。
#
# cron間隔（60分、2026/08/31改訂）の根拠:
# 当初は「1日10,000ユニット」の枠だけで試算し30分間隔にしていたが、実際には
# YouTube Data API v3のsearch.listには単位コストとは別枠で「1日100回」という
# 呼び出し回数そのものの上限があり、これを見落としていた（2026/08/31、
# 本番のquotaExceededで発覚。詳細はCLAUDE-5.md/CLAUDE-6.md参照）。
# LIVE機能追加後は1回のビルドでsearch.listを2回（予約配信用・配信中用）呼ぶため、
# 30分間隔(48回/日)だけで最大96回とほぼ上限を使い切ってしまい、CMS編集等の
# push起因ビルドが少し重なるだけで上限超過していた。
# 60分間隔＝24回/日なら search.list消費は48回/日に収まり、push起因ビルド用の
# 余裕を十分に残せる。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
